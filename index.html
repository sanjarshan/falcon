<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Falcon | Engineering Solver</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://unpkg.com/mathlive"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 0.9em;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        .output-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #0d1117;
            border-left: 4px solid #58a6ff;
            border-radius: 0 5px 5px 0;
            display: none; /* Hidden until solve is clicked */
            white-space: pre-wrap;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .math-toolbar {
            width: 100%;
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .math-toolbar button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            margin-top: 0; 
            width: auto;
            flex-grow: 1;
            transition: background-color 0.2s;
            font-size: 16px;
        }
        .math-toolbar button:hover {
            background-color: #30363d;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PROJECT FALCON</h1>
        <p class="subtitle">Advanced Engineering Step-by-Step Solver</p>

        <div style="width: 100%; display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
            <label for="imageUpload" style="background-color: #1f6feb; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; font-family: 'Inter', sans-serif; transition: background-color 0.2s;">
                📷 UPLOAD EXAM QUESTION
            </label>
            <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="processImage()">
            <span id="imageName" style="color: #8b949e; font-size: 14px; font-family: 'Inter', sans-serif;">No image selected</span>
        </div>

        <img id="imagePreview" style="max-width: 100%; max-height: 250px; display: none; margin-bottom: 15px; border-radius: 5px; border: 1px solid #30363d; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">

        <div style="display: flex; background-color: #21262d; border-radius: 5px; padding: 4px; margin-bottom: 10px; border: 1px solid #30363d;">
            <button id="textModeBtn" onclick="setMode('text')" style="flex: 1; padding: 8px; border: none; border-radius: 4px; background-color: #30363d; color: white; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;">TEXT MODE</button>
            <button id="mathModeBtn" onclick="setMode('math')" style="flex: 1; padding: 8px; border: none; border-radius: 4px; background-color: transparent; color: #8b949e; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;">MATH MODE</button>
        </div>

        <textarea id="textInput" placeholder="Type your question here (Native Keyboard)..." style="width: 100%; height: 100px; background-color: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px; padding: 15px; font-family: 'Inter', sans-serif; font-size: 16px; box-sizing: border-box;"></textarea>
        
        <math-field id="mathInput" style="display: none; width: 100%; padding: 15px; font-size: 1.2em; background-color: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px; outline: none; box-sizing: border-box;">
        </math-field>
        
        <button id="solveBtn" onclick="simulateSolve()">INITIATE SOLVE</button>

        <div id="outputArea" class="output-box">
            </div>
    </div>

    <script>

        // Listen for the 'paste' event anywhere on the window
        window.addEventListener('paste', (event) => {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.indexOf("image") !== -1) {
                    const blob = item.getAsFile();
                    // Send the pasted blob to our process engine
                    processImage(blob);
                }
            }
        });
        
        // Global Mobile Fixes for MathLive
        window.addEventListener('DOMContentLoaded', () => {
            const mathField = document.getElementById('mathInput');
            
            // 1. Force the virtual keyboard to scale properly on mobile
            mathField.setOptions({
                virtualKeyboardMode: "onfocus", // Only show when tapped
                virtualKeyboardTheme: "dark",
                virtualKeyboardLayout: "alphabetical" // Simplified for mobile
            });
        });

        let currentMode = 'text';

        function setMode(mode) {
            currentMode = mode;
            const textInput = document.getElementById('textInput');
            const mathInput = document.getElementById('mathInput');
            const textBtn = document.getElementById('textModeBtn');
            const mathBtn = document.getElementById('mathModeBtn');

            if (mode === 'text') {
                textInput.style.display = "block";
                mathInput.style.display = "none";
                textBtn.style.backgroundColor = "#30363d";
                textBtn.style.color = "white";
                mathBtn.style.backgroundColor = "transparent";
                mathBtn.style.color = "#8b949e";
            } else {
                textInput.style.display = "none";
                mathInput.style.display = "block";
                mathBtn.style.backgroundColor = "#30363d";
                mathBtn.style.color = "white";
                textBtn.style.backgroundColor = "transparent";
                textBtn.style.color = "#8b949e";
            }
        }

        // This global variable will hold the shredded image text
        let base64ImagePayload = null;

        function processImage(manualFile = null) {
            const fileInput = document.getElementById('imageUpload');
            // If manualFile exists (from paste), use it. Otherwise, use the button input.
            const file = manualFile || fileInput.files[0];
            
            if (!file) return;

            // Update UI with file name (or "Pasted Image")
            document.getElementById('imageName').innerText = manualFile ? "Pasted Image" : file.name;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('imagePreview');
                img.src = e.target.result;
                img.style.display = "block";
                
                // Shred the image into Base64 for the Vercel Bridge
                base64ImagePayload = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        async function simulateSolve() {
            // 1. Get values from the specific mode inputs
            const textVal = document.getElementById('textInput').value.trim();
            const mathVal = document.getElementById('mathInput').value.trim();
            
            // 2. Determine which input to use based on the current mode
            const input = (currentMode === 'text') ? textVal : mathVal;

            // 3. Validation: Stop if EVERYTHING is empty
            if(!input && !base64ImagePayload) {
                alert("Please enter a problem or upload an image.");
                return;
            }
            
            const btn = document.getElementById('solveBtn');
            const output = document.getElementById('outputArea');

            // 4. UI Transition: Lock the button and show the spinner
            btn.innerHTML = '<div class="spinner"></div> CALCULATING MATRIX...';
            btn.style.backgroundColor = "#8b949e";
            btn.disabled = true;
            
            output.style.display = "block";
            output.innerHTML = "Establishing secure connection to Falcon Server...";

            try {
                const vercelURL = "https://falcon-tawny.vercel.app/api/solve";

                const response = await fetch(vercelURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        problem: input,
                        image: base64ImagePayload 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success! Convert Markdown to HTML
                    output.innerHTML = marked.parse(data.solution);
                    
                    // Trigger MathJax to render the LaTeX
                    if (window.MathJax) {
                        MathJax.typesetPromise([output]).catch(function (err) {
                            console.error('MathJax Error:', err.message);
                        });
                    }
                } else {
                    // API or Vercel Error
                    output.innerHTML = "System Error: " + (data.error || "The bridge collapsed.");
                }

            } catch (error) {
                console.error(error);
                output.innerHTML = "Fatal Error: Could not connect to the server. Check your internet or Vercel logs.";
            } finally {
                // Unlock the UI
                btn.innerHTML = "INITIATE SOLVE";
                btn.style.backgroundColor = "#238636";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
