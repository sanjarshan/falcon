<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Falcon | Engineering Solver</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 0.9em;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        .output-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #0d1117;
            border-left: 4px solid #58a6ff;
            border-radius: 0 5px 5px 0;
            display: none; /* Hidden until solve is clicked */
            white-space: pre-wrap;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PROJECT FALCON</h1>
        <p class="subtitle">Advanced Engineering Step-by-Step Solver</p>

        <textarea id="problemInput" placeholder="Enter your Circuit Theory, Vector Analysis, or math problem here..."></textarea>
        
        <button id="solveBtn" onclick="simulateSolve()">INITIATE SOLVE</button>

        <div id="outputArea" class="output-box">
            </div>
    </div>

    <script>
async function simulateSolve() {
            const btn = document.getElementById('solveBtn');
            const output = document.getElementById('outputArea');
            const input = document.getElementById('problemInput').value;

            if(!input) {
                alert("Please enter a problem first. The system requires input.");
                return;
            }

            // Lock the button and add the spinner
            btn.innerHTML = '<div class="spinner"></div> CALCULATING MATRIX...';
            btn.style.backgroundColor = "#8b949e";
            btn.disabled = true;
            
            output.style.display = "block";
            output.innerHTML = "Establishing secure connection to Falcon Server...";

            try {
                const vercelURL = "https://falcon-tawny.vercel.app/api/solve";

                const response = await fetch(vercelURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ problem: input })
                });

                const data = await response.json();

                if (response.ok) {
                    // 1. Convert Markdown to HTML
                    output.innerHTML = marked.parse(data.solution);
                    
                    // 2. Tell MathJax to scan the box and draw the beautiful math
                    if (window.MathJax) {
                        MathJax.typesetPromise([output]).catch(function (err) {
                            console.error('MathJax Error:', err.message);
                        });
                    }
                } else {
                    // API or Vercel Error
                    output.innerHTML = "System Error: " + (data.error || "The bridge collapsed.");
                }

            } catch (error) {
                console.error(error);
                output.innerHTML = "Fatal Error: Could not connect to the server. Check your internet or Vercel logs.";
            } finally {
                // Unlock the button
                btn.innerHTML = "INITIATE SOLVE";
                btn.style.backgroundColor = "#238636";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
