<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>FALCON | Engineering Calculation Solver</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        MathJax = { 
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            options: { enableMenu: false, renderActions: { assistiveMml: [] } } 
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00f2ff",
              "secondary": "#a0fb00",
              "background": "#000000",
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Space Grotesk"],
            }
          },
        },
      }
    </script>
    <style>
      :root { --keyboard-zindex: 100000 !important; }
      body { background-color: #000000; color: white; -ms-overflow-style: none; scrollbar-width: none; min-height: 100vh;}
      ::-webkit-scrollbar { display: none; }
      
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .neon-border { border: 2px solid #00f2ff; box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
      .neon-text-cyan { color: #00f2ff; }
      .neon-text-green { color: #a0fb00; }
      
      /* Base MathField Styling */
      math-field {
          width: 100%; min-height: 120px; font-size: 1.25rem; color: #ffffff;
          background: transparent; border: none; outline: none; padding: 0; font-family: monospace;
          touch-action: manipulation; transition: all 0.3s ease;
      }
      math-field::part(virtual-keyboard-toggle) { color: #00f2ff; }

      /* THE COMPACT MODE UI PHYSICS */
      #inputCard { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: text; }
      
      .is-compact {
          min-height: 100px !important;
          padding: 1rem 1.5rem !important;
      }
      .is-compact textarea {
          height: 40px !important;
          font-size: 1rem !important;
      }
      .is-compact math-field {
          min-height: 40px !important;
          font-size: 1.1rem !important;
      }
      .is-compact .input-icons {
          margin-top: 0.5rem !important;
          transform: scale(0.85);
          transform-origin: right center;
      }

      /* CUSTOM CYBERPUNK SCROLLBAR */
      .custom-scroll::-webkit-scrollbar { display: block; width: 6px; }
      .custom-scroll::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 10px; }
      .custom-scroll::-webkit-scrollbar-thumb { background: #00f2ff; border-radius: 10px; }
      .custom-scroll::-webkit-scrollbar-thumb:hover { background: #a0fb00; }
    </style>
</head>
<body class="font-body selection:bg-primary/30 px-4 md:px-10 overflow-x-hidden relative">

    <div class="max-w-[1600px] mx-auto grid grid-cols-1 md:grid-cols-[280px_1fr_280px] gap-8 md:gap-12 relative items-start">
        
        <aside class="order-3 md:order-1 flex flex-col md:pt-32 md:sticky md:top-0 h-fit pb-10">
            <div class="flex items-center space-x-3 mb-8 neon-text-green">
                <span class="material-symbols-outlined">upcoming</span>
                <h3 class="text-xl font-bold uppercase tracking-widest">Coming Soon</h3>
            </div>
            <div class="space-y-6">
                <div class="flex items-start space-x-4"><div class="w-1.5 h-6 bg-secondary mt-0.5 shadow-[0_0_8px_#a0fb00]"></div><span class="text-lg font-medium">PDF Uploads</span></div>
                <div class="flex items-start space-x-4"><div class="w-1.5 h-6 bg-secondary mt-0.5 shadow-[0_0_8px_#a0fb00]"></div><span class="text-lg font-medium">Calculator Input</span></div>
                <div class="flex items-start space-x-4"><div class="w-1.5 h-6 bg-secondary mt-0.5 shadow-[0_0_8px_#a0fb00]"></div><span class="text-lg font-medium">Book Export</span></div>
            </div>
        </aside>

        <main class="order-1 md:order-2 flex flex-col items-center relative">
            
            <header class="text-center mb-8 sticky top-0 bg-[#000000e6] backdrop-blur-md z-50 pt-8 pb-4 w-full border-b border-white/5">
                <h1 class="text-4xl md:text-5xl font-bold tracking-tighter mb-1">FALCON</h1>
                <p class="text-[10px] md:text-xs font-medium tracking-[0.2em] md:tracking-[0.3em] uppercase opacity-80">Engineering Calculation Solver</p>
            </header>

            <div class="mb-8 flex items-center p-1 border-2 border-primary rounded-full w-fit bg-black relative z-40">
                <div id="toggleSlider" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-primary rounded-full transition-transform duration-300"></div>
                <button id="textModeBtn" class="relative z-10 px-10 py-2 rounded-full text-sm font-bold text-black transition-colors" onclick="setMode('text')">TEXT</button>
                <button id="mathModeBtn" class="relative z-10 px-10 py-2 rounded-full text-sm font-bold text-primary transition-colors" onclick="setMode('math')">MATH</button>
            </div>

            <div class="w-full max-w-2xl relative mb-6 z-40">
                <div id="inputCard" onclick="expandInput()" class="neon-border rounded-[2rem] p-6 md:p-8 bg-black min-h-[180px] md:min-h-[220px] flex flex-col relative overflow-hidden">
                    <textarea id="textInput" class="w-full flex-grow bg-transparent border-none focus:ring-0 text-lg font-light placeholder:text-primary/20 resize-none text-white outline-none transition-all" placeholder="Enter engineering problem..."></textarea>
                    <math-field id="mathInput" style="display: none;"></math-field>
                    
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="processImage()">
                    <div class="mt-2 flex justify-between items-center w-full">
                        <span id="imageName" class="text-xs text-primary font-bold"></span>
                        <button id="removeImgBtn" onclick="clearImage()" class="hidden text-xs text-[#ffb4ab] hover:underline">[REMOVE]</button>
                    </div>
                    <img id="imagePreview" class="hidden max-h-32 mt-2 border border-primary rounded-lg self-start">

                    <div class="input-icons flex justify-end items-center space-x-4 mt-4 text-primary transition-all duration-300">
                        <span class="material-symbols-outlined text-3xl cursor-pointer hover:scale-110 transition-transform">attach_file</span>
                        <span class="material-symbols-outlined text-3xl cursor-pointer hover:scale-110 transition-transform" onclick="document.getElementById('imageUpload').click(); event.stopPropagation();">photo_camera</span>
                    </div>
                </div>
            </div>

            <div class="w-full max-w-2xl flex flex-col items-center md:items-end z-40">
                <div class="flex space-x-4 mb-6 w-full md:w-auto">
                    <button onclick="resetEngine()" class="flex-1 md:flex-none px-8 py-2 border-2 border-white/20 text-white rounded-full font-bold text-sm tracking-widest hover:border-primary hover:text-primary transition-all">NEW CALC</button>
                    <button id="solveBtn" onclick="simulateSolve()" class="flex-1 md:flex-none px-12 py-2 bg-primary text-black rounded-full font-bold text-lg tracking-widest hover:brightness-110 transition-all shadow-[0_0_15px_rgba(0,242,255,0.4)]">SOLVE</button>
                </div>
                
                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden mb-8 flex-shrink-0">
                    <div class="h-full w-full bg-primary shadow-[0_0_15px_#00f2ff]"></div>
                </div>

                <div id="outputContainer" class="hidden w-full bg-[#0a0a0a] border-l-4 border-primary rounded-r-xl p-6 md:p-8 mb-12 shadow-lg flex flex-col max-h-[55vh]">
                    <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-2 flex-shrink-0">
                        <h3 class="text-primary font-bold tracking-widest uppercase text-sm">Processed Output</h3>
                        <div id="exportBtnRow" class="hidden">
                            <button onclick="alert('PDF Engine Temporarily Offline for UI Architecture Testing.')" class="px-4 py-1.5 bg-primary text-black rounded-full text-[10px] font-bold uppercase tracking-widest hover:brightness-110 transition-all shadow-[0_0_10px_rgba(0,242,255,0.3)]">
                                Export PDF
                            </button>
                        </div>
                    </div>
                    
                    <div id="outputArea" class="text-white font-sans text-base leading-relaxed overflow-y-auto custom-scroll pr-4 pb-4"></div>
                </div>
            </div>
        </main>

        <aside class="order-2 md:order-3 flex flex-col md:pt-32 md:sticky md:top-0 h-fit pb-10">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center space-x-3 neon-text-cyan">
                    <span class="material-symbols-outlined">history</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest">History</h3>
                </div>
                <button class="px-4 py-1.5 bg-primary text-black text-[10px] font-bold rounded-full uppercase tracking-widest shadow-[0_0_10px_rgba(0,242,255,0.3)]">Bulk Export</button>
            </div>
            <div id="historyList" class="space-y-4"></div>
        </aside>

    </div>

    <script>
        let currentMode = 'text';
        let base64ImagePayload = null;
        let solveHistory = JSON.parse(localStorage.getItem('falconHistory')) || [];
        let currentHistoryIndex = -1;

        // --- NEW: UI EXPAND/SHRINK LOGIC ---
        function shrinkInput() {
            document.getElementById('inputCard').classList.add('is-compact');
        }
        function expandInput() {
            document.getElementById('inputCard').classList.remove('is-compact');
            // Give focus back to the correct input field
            if(currentMode === 'text') {
                document.getElementById('textInput').focus();
            } else {
                document.getElementById('mathInput').focus();
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const textInput = document.getElementById('textInput');
            const mathInput = document.getElementById('mathInput');
            const textBtn = document.getElementById('textModeBtn');
            const mathBtn = document.getElementById('mathModeBtn');
            const slider = document.getElementById('toggleSlider');

            if (mode === 'text') {
                textInput.style.display = "block";
                mathInput.style.display = "none";
                textBtn.style.color = "#000000";
                mathBtn.style.color = "#00f2ff";
                slider.style.transform = "translateX(0%)";
            } else {
                textInput.style.display = "none";
                mathInput.style.display = "block";
                mathBtn.style.color = "#000000";
                textBtn.style.color = "#00f2ff";
                slider.style.transform = "translateX(100%)";
            }
            expandInput(); // Always expand when switching modes to type
        }

        function processImage(manualFile = null) {
            const fileInput = document.getElementById('imageUpload');
            const file = manualFile || fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImagePayload = e.target.result.split(',')[1];
                document.getElementById('imageName').innerText = manualFile ? "Pasted Image" : file.name;
                const imgPreview = document.getElementById('imagePreview');
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                document.getElementById('removeImgBtn').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            base64ImagePayload = null;
            document.getElementById('imageUpload').value = "";
            document.getElementById('imageName').innerText = "";
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i in items) {
                if (items[i].kind === 'file' && items[i].type.indexOf("image") !== -1) {
                    processImage(items[i].getAsFile());
                }
            }
        });

        function resetEngine() {
            document.getElementById('textInput').value = "";
            document.getElementById('mathInput').value = "";
            clearImage();
            document.getElementById('outputContainer').style.display = "none";
            document.getElementById('outputArea').innerHTML = "";
            currentHistoryIndex = -1;
            expandInput(); // Expand input on new calc
            renderHistory();
        }

        function saveToHistory(problemText, solutionHtml, imageBase64) {
            const newEntry = {
                id: Date.now(),
                title: problemText ? problemText.substring(0, 20) + "..." : "Image Problem",
                problem: problemText,
                solution: solutionHtml,
                image: imageBase64
            };
            solveHistory.unshift(newEntry);
            if (solveHistory.length > 5) solveHistory.pop();
            localStorage.setItem('falconHistory', JSON.stringify(solveHistory));
            currentHistoryIndex = 0;
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (solveHistory.length === 0) {
                list.innerHTML = '<div class="opacity-50 italic text-sm">No recent telemetry.</div>';
                return;
            }
            solveHistory.forEach((entry, index) => {
                const div = document.createElement('div');
                const isActive = (index === currentHistoryIndex);
                div.className = `flex items-center space-x-4 cursor-pointer transition-all ${isActive ? 'opacity-100' : 'opacity-60 hover:opacity-100'}`;
                div.innerHTML = `<div class="w-1.5 h-6 ${isActive ? 'bg-primary shadow-[0_0_8px_#00f2ff]' : 'bg-white/40'}"></div><span class="text-lg ${isActive ? 'font-bold text-primary' : 'font-medium'} flex-grow">Solve ${solveHistory.length - index}</span>`;
                div.onclick = () => { currentHistoryIndex = index; renderHistory(); loadHistoryEntry(index); };
                list.appendChild(div);
            });
        }

        function loadHistoryEntry(index) {
            const entry = solveHistory[index];
            if(currentMode === 'text') document.getElementById('textInput').value = entry.problem || "";
            else document.getElementById('mathInput').value = entry.problem || "";
            
            if (entry.image) {
                const img = document.getElementById('imagePreview');
                img.src = "data:image/jpeg;base64," + entry.image;
                img.style.display = "block";
                document.getElementById('removeImgBtn').style.display = "block";
                base64ImagePayload = entry.image;
            } else clearImage();
            
            document.getElementById('outputContainer').style.display = "flex";
            document.getElementById('outputArea').innerHTML = entry.solution;
            document.getElementById('exportBtnRow').style.display = "block";
            
            shrinkInput(); // Shrink input when loading history
            document.getElementById('outputArea').scrollTop = 0;
            
            if (window.MathJax) MathJax.typesetPromise([document.getElementById('outputArea')]);
        }

        async function simulateSolve() {
            const textVal = document.getElementById('textInput').value.trim();
            const mathVal = document.getElementById('mathInput').value.trim();
            const input = (currentMode === 'text') ? textVal : mathVal;
            if(!input && !base64ImagePayload) return;
            
            const btn = document.getElementById('solveBtn');
            const outputArea = document.getElementById('outputArea');
            const outputContainer = document.getElementById('outputContainer');
            
            btn.innerHTML = 'CALCULATING...'; btn.disabled = true; btn.style.opacity = '0.5';
            outputContainer.style.display = "flex"; 
            outputArea.innerHTML = "Establishing secure connection...";
            document.getElementById('exportBtnRow').style.display = "none";
            
            // Shrink the input box immediately to make room for the loading state
            shrinkInput();

            try {
                const response = await fetch('https://falcon-tawny.vercel.app/api/solve', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem: input, image: base64ImagePayload })
                });
                const data = await response.json();
                if (response.ok) {
                    const formatted = marked.parse(data.solution);
                    outputArea.innerHTML = formatted;
                    
                    if (window.MathJax) MathJax.typesetPromise([outputArea]);
                    saveToHistory(input, formatted, base64ImagePayload);
                    document.getElementById('exportBtnRow').style.display = "block";
                    outputArea.scrollTop = 0;
                } else outputArea.innerHTML = `<span class="text-red-400">Error: ${data.error}</span>`;
            } catch (e) { outputArea.innerHTML = "<span class='text-red-400'>Fatal Error: Connection failed.</span>"; }
            finally { btn.innerHTML = "SOLVE"; btn.disabled = false; btn.style.opacity = '1'; }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            const mf = document.getElementById('mathInput');
            if(mf) {
                mf.setOptions({ virtualKeyboardMode: "onfocus", virtualKeyboardTheme: "dark" });
                window.mathVirtualKeyboard.container = document.body;
            }
        });
    </script>
</body>
</html>
