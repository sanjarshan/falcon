<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FALCON | Engineering Calculation Solver</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00f2ff",
              "secondary": "#a0fb00",
              "background": "#000000",
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Space Grotesk"],
            }
          },
        },
      }
    </script>
    <style>
      body { background-color: #000000; color: white; -ms-overflow-style: none; scrollbar-width: none;}
      ::-webkit-scrollbar { display: none; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .neon-border { border: 2px solid #00f2ff; box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
      .neon-text-cyan { color: #00f2ff; }
      .neon-text-green { color: #a0fb00; }
      
      math-field {
          width: 100%; min-height: 120px; font-size: 1.25rem; color: #ffffff;
          background: transparent; border: none; outline: none; padding: 0; font-family: monospace;
      }
    </style>
</head>
<body class="font-body selection:bg-primary/30 min-h-screen flex flex-col items-center py-8 px-4 md:py-12 md:px-6 overflow-x-hidden">

    <header class="text-center mb-10 md:mb-16 mt-4">
        <h1 class="text-5xl md:text-6xl font-bold tracking-tighter mb-2">FALCON</h1>
        <p class="text-xs md:text-sm font-medium tracking-[0.2em] md:tracking-[0.3em] uppercase opacity-80">Engineering Calculation Solver</p>
    </header>

    <main class="w-full max-w-5xl flex flex-col items-center">
        <div class="w-full max-w-2xl flex flex-col items-center">
            
            <div class="mb-6 md:mb-10 flex items-center p-1 border-2 border-primary rounded-full w-fit bg-black relative">
                <div id="toggleSlider" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-primary rounded-full transition-transform duration-300"></div>
                <button id="textModeBtn" class="relative z-10 px-8 py-2 md:px-10 rounded-full text-sm font-bold text-black transition-colors" onclick="setMode('text')">TEXT</button>
                <button id="mathModeBtn" class="relative z-10 px-8 py-2 md:px-10 rounded-full text-sm font-bold text-primary transition-colors" onclick="setMode('math')">MATH</button>
            </div>

            <div class="w-full relative mb-6">
                <div class="neon-border rounded-[2rem] p-6 md:p-8 bg-black min-h-[180px] md:min-h-[220px] flex flex-col">
                    <textarea id="textInput" class="w-full flex-grow bg-transparent border-none focus:ring-0 text-lg font-light placeholder:text-primary/20 resize-none text-white outline-none" placeholder="Enter engineering problem..."></textarea>
                    <math-field id="mathInput" style="display: none;"></math-field>
                    
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="processImage()">
                    <div class="mt-2 flex justify-between items-center w-full">
                        <span id="imageName" class="text-xs text-primary font-bold"></span>
                        <button id="removeImgBtn" onclick="clearImage()" class="hidden text-xs text-[#ffb4ab] hover:underline">[REMOVE]</button>
                    </div>
                    <img id="imagePreview" class="hidden max-h-32 mt-2 border border-primary rounded-lg">

                    <div class="flex justify-end items-center space-x-4 mt-4 text-primary">
                        <span class="material-symbols-outlined text-2xl md:text-3xl cursor-pointer hover:scale-110 transition-transform">attach_file</span>
                        <span class="material-symbols-outlined text-2xl md:text-3xl cursor-pointer hover:scale-110 transition-transform" onclick="document.getElementById('imageUpload').click()">photo_camera</span>
                    </div>
                </div>
            </div>

            <div class="w-full flex flex-col items-center md:items-end">
                
                <div class="flex flex-col md:flex-row w-full md:w-auto space-y-4 md:space-y-0 md:space-x-4 mb-6">
                    <button onclick="resetEngine()" class="px-8 py-2 md:py-3 border-2 border-[#3a4a49] text-white rounded-full font-bold text-sm md:text-base tracking-widest hover:border-primary hover:text-primary transition-all w-full md:w-auto">
                        NEW CALC
                    </button>
                    <button id="solveBtn" onclick="simulateSolve()" class="px-12 py-2 md:py-3 bg-primary text-black rounded-full font-bold text-base md:text-lg tracking-widest hover:brightness-110 transition-all w-full md:w-auto shadow-[0_0_15px_rgba(0,242,255,0.4)]">
                        SOLVE
                    </button>
                </div>
                
                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden mb-6">
                    <div class="h-full w-full bg-primary shadow-[0_0_15px_#00f2ff]"></div>
                </div>

                <div id="outputContainer" class="hidden w-full bg-[#0a0a0a] border-l-4 border-primary rounded-r-xl p-6 md:p-8 mb-8 shadow-lg">
                    <h3 class="text-primary font-bold tracking-widest uppercase mb-4 text-sm">Processed Output</h3>
                    <div id="outputArea" class="text-white font-sans text-sm md:text-base leading-relaxed"></div>
                    <div id="exportBtnRow" class="hidden justify-end mt-6">
                        <button class="px-6 py-2 bg-primary text-black rounded-full text-xs font-bold uppercase tracking-widest hover:brightness-110 transition-all">Export PDF</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full flex flex-col md:grid md:grid-cols-2 gap-12 md:gap-20 mt-10 md:mt-16">
            
            <section class="flex flex-col order-1 md:order-2">
                <div class="flex items-center justify-between mb-6 md:mb-8">
                    <div class="flex items-center space-x-3 neon-text-cyan">
                        <span class="material-symbols-outlined">history</span>
                        <h3 class="text-lg md:text-xl font-bold uppercase tracking-widest">History</h3>
                    </div>
                    <button class="px-4 md:px-6 py-1.5 bg-primary text-black text-[10px] md:text-xs font-bold rounded-full hover:brightness-110 transition-all uppercase tracking-widest shadow-[0_0_10px_rgba(0,242,255,0.3)]">
                        Bulk Export
                    </button>
                </div>
                
                <div id="historyList" class="space-y-4 mb-8">
                    </div>
            </section>

            <section class="order-2 md:order-1">
                <div class="flex items-center space-x-3 mb-6 md:mb-8 neon-text-green">
                    <span class="material-symbols-outlined">upcoming</span>
                    <h3 class="text-lg md:text-xl font-bold uppercase tracking-widest">Coming Soon</h3>
                </div>
                <div class="space-y-4 md:space-y-6">
                    <div class="flex items-start space-x-4"><div class="w-1.5 h-6 bg-secondary mt-0.5 shadow-[0_0_8px_#a0fb00]"></div><span class="text-base md:text-lg font-medium">PDF Uploads</span></div>
                    <div class="flex items-start space-x-4"><div class="w-1.5 h-6 bg-secondary mt-0.5 shadow-[0_0_8px_#a0fb00]"></div><span class="text-base md:text-lg font-medium">Calculator Input</span></div>
                    <div class="flex items-start space-x-4"><div class="w-1.5 h-6 bg-secondary mt-0.5 shadow-[0_0_8px_#a0fb00]"></div><span class="text-base md:text-lg font-medium">Book Export</span></div>
                </div>
            </section>

        </div>
    </main>

    <script>
        let currentMode = 'text';
        let base64ImagePayload = null;

        function setMode(mode) {
            currentMode = mode;
            const textInput = document.getElementById('textInput');
            const mathInput = document.getElementById('mathInput');
            const textBtn = document.getElementById('textModeBtn');
            const mathBtn = document.getElementById('mathModeBtn');
            const slider = document.getElementById('toggleSlider');

            if (mode === 'text') {
                textInput.style.display = "block";
                mathInput.style.display = "none";
                textBtn.style.color = "#000000";
                mathBtn.style.color = "#00f2ff";
                slider.style.transform = "translateX(0%)";
            } else {
                textInput.style.display = "none";
                mathInput.style.display = "block";
                mathBtn.style.color = "#000000";
                textBtn.style.color = "#00f2ff";
                slider.style.transform = "translateX(100%)";
            }
        }

        function processImage(manualFile = null) {
            const fileInput = document.getElementById('imageUpload');
            const file = manualFile || fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImagePayload = e.target.result.split(',')[1];
                document.getElementById('imageName').innerText = manualFile ? "Pasted Image" : file.name;
                const imgPreview = document.getElementById('imagePreview');
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                document.getElementById('removeImgBtn').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            base64ImagePayload = null;
            document.getElementById('imageUpload').value = "";
            document.getElementById('imageName').innerText = "";
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        // Paste Event Listener for Images
        window.addEventListener('paste', (event) => {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.indexOf("image") !== -1) {
                    const blob = item.getAsFile();
                    processImage(blob);
                }
            }
        });

        // --- NEW CALCULATION (RESET ENGINE) ---
        function resetEngine() {
            document.getElementById('textInput').value = "";
            document.getElementById('mathInput').value = "";
            clearImage();
            document.getElementById('outputContainer').style.display = "none";
            document.getElementById('outputArea').innerHTML = "";
            currentHistoryIndex = -1; 
            renderHistory();
        }

        // --- HISTORY ENGINE ---
        let solveHistory = JSON.parse(localStorage.getItem('falconHistory')) || [];
        let currentHistoryIndex = -1; // -1 means no history item is currently selected

        function saveToHistory(problemText, solutionHtml, imageBase64) {
            const newEntry = {
                id: Date.now(),
                title: problemText ? problemText.substring(0, 20) + "..." : "Image Input",
                problem: problemText,
                solution: solutionHtml,
                image: imageBase64
            };
            solveHistory.unshift(newEntry);
            if (solveHistory.length > 5) solveHistory.pop(); // Keep last 5 for Pro feel
            localStorage.setItem('falconHistory', JSON.stringify(solveHistory));
            currentHistoryIndex = 0; 
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = ''; 
            
            if (solveHistory.length === 0) {
                list.innerHTML = '<div class="opacity-50 italic">No recent telemetry logs.</div>';
                return;
            }

            solveHistory.forEach((entry, index) => {
                const div = document.createElement('div');
                
                if (index === currentHistoryIndex) {
                    div.className = "flex items-center space-x-4 group cursor-pointer mb-4";
                    div.innerHTML = `<div class="w-1.5 h-6 bg-primary shadow-[0_0_8px_#00f2ff]"></div><span class="text-base md:text-lg font-bold text-primary flex-grow">Solve ${solveHistory.length - index}: ${entry.title}</span>`;
                } else {
                    div.className = "flex items-center space-x-4 group cursor-pointer mb-4 opacity-60 hover:opacity-100 transition-all";
                    div.innerHTML = `<div class="w-1.5 h-6 bg-white opacity-40 group-hover:bg-primary group-hover:opacity-100 transition-all"></div><span class="text-base md:text-lg font-medium flex-grow">Solve ${solveHistory.length - index}: ${entry.title}</span>`;
                }
                
                div.onclick = () => {
                    currentHistoryIndex = index;
                    renderHistory();
                    loadHistoryEntry(index);
                };
                list.appendChild(div);
            });
        }

        function loadHistoryEntry(index) {
            const entry = solveHistory[index];
            const outputArea = document.getElementById('outputArea');
            const outputContainer = document.getElementById('outputContainer');
            
            if(currentMode === 'text') {
                document.getElementById('textInput').value = entry.problem || "";
            } else {
                document.getElementById('mathInput').value = entry.problem || "";
            }
            
            if (entry.image) {
                const img = document.getElementById('imagePreview');
                img.src = "data:image/jpeg;base64," + entry.image;
                img.style.display = "block";
                document.getElementById('imageName').innerText = "History Image";
                document.getElementById('removeImgBtn').style.display = "block";
                base64ImagePayload = entry.image;
            } else {
                clearImage();
            }

            outputContainer.style.display = "block";
            outputArea.innerHTML = entry.solution;
            document.getElementById('exportBtnRow').style.display = "flex";
            if (window.MathJax) MathJax.typesetPromise([outputArea]);
        }

        // --- SOLVE EXECUTION ---
        async function simulateSolve() {
            const textInput = document.getElementById('textInput').value.trim();
            const mathInput = document.getElementById('mathInput').value.trim();
            const input = (currentMode === 'text') ? textInput : mathInput;
            
            if(!input && !base64ImagePayload) return;

            const btn = document.getElementById('solveBtn');
            const outputArea = document.getElementById('outputArea');
            const outputContainer = document.getElementById('outputContainer');

            btn.innerHTML = 'CALCULATING...';
            btn.style.opacity = '0.5';
            btn.disabled = true;
            
            outputContainer.style.display = "block";
            outputArea.innerHTML = "Establishing secure connection to Falcon Server...";
            document.getElementById('exportBtnRow').style.display = "none"; // Hide export while loading

            try {
                // Ensure this points to your active Vercel domain for local testing
                const response = await fetch('https://falcon-tawny.vercel.app/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem: input, image: base64ImagePayload })
                });

                const data = await response.json();
                
                if (response.ok) {
                    const formattedSolution = marked.parse(data.solution);
                    outputArea.innerHTML = formattedSolution;
                    if (window.MathJax) MathJax.typesetPromise([outputArea]);
                    
                    saveToHistory(input, formattedSolution, base64ImagePayload);
                    document.getElementById('exportBtnRow').style.display = "flex";
                } else {
                    outputArea.innerHTML = "<span class='text-[#ffb4ab]'>System Error: " + (data.error || "Bridge collapsed.") + "</span>";
                }
            } catch (error) {
                outputArea.innerHTML = "<span class='text-[#ffb4ab]'>Fatal Error: Could not connect to server. Check Vercel logs.</span>";
            } finally {
                btn.innerHTML = "SOLVE";
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', () => { renderHistory(); });
    </script>
</body>
</html>
