<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Falcon | Sumtying</title>
    
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    
    <meta name="description" content="A sovereign engineering calculation solver. Dedicated math vector engine and instant PDF ledgers.">
    <meta name="keywords" content="Falcon Calculator, Sumtying, Math Engine, Sanjarshan Shankar, SaaS, Engineering Tools">
    <meta name="author" content="Sanjarshan Shankar">
    <meta name="creator" content="Sanjarshan Shankar">
    <meta name="publisher" content="Sanjarshan Shankar">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Falcon | Sumtying">
    <meta property="og:description" content="The sovereign calculation engine for digital architects. Created by Sanjarshan Shankar.">
    <meta property="og:type" content="website">
    
    <link rel="icon" type="image/png" href="../components/favicon.png">
    
    <div style="display: none;" aria-hidden="true">
        Architecture and Code engineered by Sanjarshan Shankar.
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        MathJax = { 
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            options: { enableMenu: false, renderActions: { assistiveMml: [] } } 
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                "bg-light": "#FAF9F6",
                "bg-dark": "#111110",  
                "card-light": "#FFFFFF",
                "card-dark": "#181817",
                "falcon": "#00E5FF",
            },
            fontFamily: {
                "serif": ["Playfair Display", "serif"],
                "sans": ["Inter", "sans-serif"],
                "mono": ["JetBrains Mono", "monospace"],
            }
          },
        },
      }
    </script>
    
    <style>
        html { background-color: #FAF9F6; }
        html.dark { background-color: #111110; }
      :root { --keyboard-zindex: 100000 !important; }
      body { 
          transition: background-color 0.7s ease, color 0.7s ease; 
          -ms-overflow-style: none; scrollbar-width: none; 
      }
      ::-webkit-scrollbar { display: none; }
      
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
      
      math-field {
          width: 100%; min-height: 120px; font-size: 1.25rem; 
          background: transparent; border: none; outline: none; padding: 0; 
          font-family: 'JetBrains Mono', monospace;
          touch-action: manipulation; transition: all 0.3s ease;
      }
      math-field { color: inherit; }
      math-field::part(virtual-keyboard-toggle) { color: #00E5FF; }

      #inputCard { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: text; }
      
      .is-compact { min-height: 90px !important; padding: 1.25rem 1.5rem !important; }
      .is-compact textarea { height: 30px !important; font-size: 0.95rem !important; }
      .is-compact math-field { min-height: 30px !important; font-size: 1rem !important; }
      .is-compact .input-icons { margin-top: 0.25rem !important; transform: scale(0.8); transform-origin: right center; }

      #mainHeader { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
      .header-compact h1 { font-size: 2.5rem !important; margin-bottom: 0 !important; }
      .header-compact p { height: 0; opacity: 0; overflow: hidden; margin: 0; }
      .header-compact { margin-bottom: 1rem !important; }

      .custom-scroll::-webkit-scrollbar { display: block; width: 4px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 10px; }
      .custom-scroll::-webkit-scrollbar-thumb:hover { background: #00E5FF; }
      
      .mode-toggle { cursor: pointer; }
    </style>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-zinc-900 dark:text-zinc-100 font-sans selection:bg-falcon/30 h-screen w-screen overflow-hidden flex flex-col relative">

    <nav class="flex-none w-full border-b border-zinc-200/50 dark:border-white/5 flex justify-center z-50">
        <div class="w-full max-w-[1600px] flex justify-between items-center px-4 md:px-10 py-5">
            <a href="../" class="text-2xl font-serif italic font-medium tracking-tight hover:opacity-70 transition-opacity">Sumtying</a>
            <div class="flex items-center gap-6">
                <span class="text-[9px] font-mono uppercase tracking-[0.3em] text-zinc-400 hidden sm:block">Module 01</span>
                <div onclick="toggleTheme()" class="mode-toggle p-2 rounded-full border border-zinc-200 dark:border-white/10 flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 transition-all">
                    <span id="themeIcon" class="material-symbols-outlined text-[18px]">dark_mode</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex-grow w-full max-w-[1600px] mx-auto flex flex-col md:grid md:grid-cols-[220px_1fr_220px] lg:grid-cols-[260px_1fr_260px] gap-8 lg:gap-12 px-4 md:px-10 overflow-y-auto md:overflow-hidden pt-6 md:pt-10 pb-4">
        
        <aside class="hidden md:flex flex-col h-full order-1 opacity-60">
            <div class="flex items-center space-x-3 mb-8 border-b border-zinc-200 dark:border-white/10 pb-4 flex-shrink-0">
                <span class="text-[10px] font-mono text-zinc-400 dark:text-zinc-500 uppercase tracking-widest">[ COMING SOON ]</span>
            </div>
            <div class="space-y-6 text-zinc-500 dark:text-zinc-400 flex-grow">
                <div class="flex items-center space-x-4">
                    <div class="w-1.5 h-1.5 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
                    <span class="text-xs font-sans tracking-wide">PDF Uploads</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="w-1.5 h-1.5 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
                    <span class="text-xs font-sans tracking-wide">Calculator Input</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="w-1.5 h-1.5 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
                    <span class="text-xs font-sans tracking-wide">Book Export</span>
                </div>
            </div>
            <div class="mt-auto text-[9px] font-mono text-zinc-400 dark:text-zinc-600 uppercase tracking-widest flex-shrink-0">
                © 2026 @sumtying
            </div>
        </aside>

        <main class="order-2 flex flex-col h-full md:overflow-hidden relative w-full max-w-2xl mx-auto">
            
            <header id="mainHeader" class="text-center mb-10 w-full flex-none">
                <h1 class="text-6xl md:text-[6.5rem] font-serif font-medium tracking-tight mb-2 leading-none">Falcon</h1>
                <p class="text-[10px] font-mono tracking-[0.2em] uppercase text-zinc-500">Calculation Engine</p>
            </header>

            <div class="mb-6 flex items-center p-1 border border-zinc-200 dark:border-white/10 rounded-full w-fit bg-card-light dark:bg-card-dark relative z-40 shadow-sm mx-auto flex-none transition-all" id="modeToggleWrapper">
                <div id="toggleSlider" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-zinc-100 dark:bg-zinc-800 rounded-full transition-transform duration-300"></div>
                <button id="textModeBtn" class="relative z-10 px-8 py-2 rounded-full text-xs font-semibold tracking-widest text-zinc-900 dark:text-zinc-100 transition-colors" onclick="setMode('text')">TEXT</button>
                <button id="mathModeBtn" class="relative z-10 px-8 py-2 rounded-full text-xs font-semibold tracking-widest text-zinc-400 transition-colors" onclick="setMode('math')">MATH</button>
            </div>

            <div class="w-full relative mb-4 z-40 flex-none">
                <div id="inputCard" onclick="focusInput()" class="bg-card-light dark:bg-card-dark border border-zinc-200 dark:border-white/10 rounded-2xl p-6 min-h-[160px] flex flex-col relative overflow-hidden shadow-sm hover:border-zinc-300 dark:hover:border-white/20 transition-colors">
                    <textarea id="textInput" class="w-full flex-grow bg-transparent border-none focus:ring-0 text-lg font-sans font-light placeholder:text-zinc-400 dark:placeholder:text-zinc-600 resize-none outline-none transition-all text-zinc-900 dark:text-zinc-100" placeholder="Enter engineering parameters..."></textarea>
                    <math-field id="mathInput" style="display: none;" class="text-zinc-900 dark:text-zinc-100"></math-field>
                    
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="processImage()">
                    
                    <div class="mt-2 flex justify-between items-center w-full">
                        <span id="imageName" class="text-[10px] font-mono text-falcon tracking-widest uppercase"></span>
                        <button id="removeImgBtn" onclick="clearImage()" class="hidden text-[10px] font-mono text-red-400 hover:underline uppercase tracking-widest">[ PURGE ]</button>
                    </div>
                    <img id="imagePreview" class="hidden max-h-24 mt-4 border border-zinc-200 dark:border-zinc-800 rounded-lg self-start object-contain">

                    <div class="input-icons flex justify-end items-center space-x-4 mt-2 text-zinc-400 dark:text-zinc-500 transition-all duration-300">
                        <span class="material-symbols-outlined text-2xl cursor-pointer hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors">attach_file</span>
                        <span class="material-symbols-outlined text-2xl cursor-pointer hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors" onclick="document.getElementById('imageUpload').click(); event.stopPropagation();">photo_camera</span>
                    </div>
                </div>
            </div>

            <div id="actionRow" class="w-full flex justify-center md:justify-end space-x-4 mb-6 flex-none">
                <button onclick="resetEngine()" class="flex-1 md:flex-none px-6 py-2.5 border border-zinc-200 dark:border-white/10 rounded-lg text-[9px] font-bold uppercase tracking-[0.2em] text-zinc-600 dark:text-zinc-400 hover:bg-zinc-50 dark:hover:bg-white/5 transition-all">Clear</button>
                <button id="solveBtn" onclick="simulateSolve()" class="flex-1 md:flex-none px-10 py-2.5 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-black rounded-lg text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-falcon dark:hover:bg-falcon hover:text-black transition-all shadow-md shadow-zinc-200 dark:shadow-none">Execute</button>
            </div>
            
            <div id="outputContainer" class="hidden flex-grow w-full bg-card-light dark:bg-card-dark border border-zinc-200 dark:border-white/10 rounded-2xl flex-col overflow-hidden shadow-sm mb-4">
                <div class="flex-none flex justify-between items-center p-6 border-b border-zinc-100 dark:border-zinc-800/50 flex-shrink-0">
                    <h3 class="text-[10px] font-mono text-zinc-400 dark:text-zinc-500 uppercase tracking-widest">[ SYSTEM_RESPONSE ]</h3>
                    <div id="exportBtnRow" class="hidden">
                        <button onclick="exportSinglePDF()" class="flex items-center gap-2 px-4 py-1.5 border border-zinc-200 dark:border-white/10 rounded-md text-[9px] font-bold uppercase tracking-[0.2em] hover:border-falcon hover:text-falcon transition-all">
                            <span class="material-symbols-outlined text-[14px]">download</span> PDF
                        </button>
                    </div>
                </div>
                <div id="outputArea" class="flex-grow font-sans text-sm md:text-base leading-relaxed overflow-y-auto custom-scroll p-6 pt-4"></div>
            </div>
        </main>

        <aside class="hidden md:flex flex-col h-full order-3">
            <div class="flex items-center justify-between mb-8 border-b border-zinc-200 dark:border-white/10 pb-4 flex-shrink-0">
                <span class="text-[10px] font-mono text-zinc-400 dark:text-zinc-500 uppercase tracking-widest">[ HISTORY ]</span>
            </div>
            <div id="historyList" class="flex-grow overflow-y-auto custom-scroll space-y-3 pb-6"></div>
        </aside>

    </div>

    <div id="pdfLoadingOverlay" class="fixed inset-0 bg-bg-light/90 dark:bg-bg-dark/90 backdrop-blur-sm flex flex-col items-center justify-center z-[999999]" style="display: none;">
        <div class="w-12 h-12 border-2 border-zinc-200 dark:border-zinc-800 border-t-falcon rounded-full animate-spin"></div>
        <p class="mt-6 text-[10px] font-mono tracking-[0.3em] uppercase text-zinc-600 dark:text-zinc-400">Compiling Ledger...</p>
    </div>

    <script>
        let currentMode = 'text';
        let base64ImagePayload = null;
        let solveHistory = JSON.parse(localStorage.getItem('falconHistory')) || [];
        let currentHistoryIndex = -1;
        let currentCleanSolution = "";

        function shrinkInput() { 
            document.getElementById('inputCard').classList.add('is-compact'); 
            document.getElementById('mainHeader').classList.add('header-compact');
        }
        
        function expandInput() {
            document.getElementById('inputCard').classList.remove('is-compact');
            document.getElementById('mainHeader').classList.remove('header-compact');
        }

        function focusInput() {
            if(currentMode === 'text') document.getElementById('textInput').focus();
            else document.getElementById('mathInput').focus();
        }

        function setMode(mode) {
            currentMode = mode;
            const textInput = document.getElementById('textInput');
            const mathInput = document.getElementById('mathInput');
            const textBtn = document.getElementById('textModeBtn');
            const mathBtn = document.getElementById('mathModeBtn');
            const slider = document.getElementById('toggleSlider');

            const isDark = document.documentElement.classList.contains('dark');
            const activeColor = isDark ? '#f4f4f5' : '#18181b'; 
            const inactiveColor = isDark ? '#a1a1aa' : '#a1a1aa'; 

            if (mode === 'text') {
                textInput.style.display = "block"; mathInput.style.display = "none";
                textBtn.style.color = activeColor; mathBtn.style.color = inactiveColor;
                slider.style.transform = "translateX(0%)";
            } else {
                textInput.style.display = "none"; mathInput.style.display = "block";
                mathBtn.style.color = activeColor; textBtn.style.color = inactiveColor;
                slider.style.transform = "translateX(100%)";
            }
            focusInput(); 
        }

        function processImage(manualFile = null) {
            const fileInput = document.getElementById('imageUpload');
            const file = manualFile || fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImagePayload = e.target.result.split(',')[1];
                document.getElementById('imageName').innerText = manualFile ? "Pasted Image" : file.name;
                const imgPreview = document.getElementById('imagePreview');
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                document.getElementById('removeImgBtn').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            base64ImagePayload = null;
            document.getElementById('imageUpload').value = "";
            document.getElementById('imageName').innerText = "";
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i in items) {
                if (items[i].kind === 'file' && items[i].type.indexOf("image") !== -1) {
                    processImage(items[i].getAsFile());
                }
            }
        });

        function resetEngine() {
            document.getElementById('textInput').value = "";
            document.getElementById('mathInput').value = "";
            clearImage();
            document.getElementById('outputContainer').classList.add('hidden');
            document.getElementById('outputContainer').classList.remove('flex');
            document.getElementById('outputArea').innerHTML = "";
            currentCleanSolution = "";
            currentHistoryIndex = -1;
            expandInput(); 
            renderHistory();
        }

        function saveToHistory(problemText, solutionHtml, imageBase64) {
            const newEntry = {
                id: Date.now(),
                title: problemText ? problemText.substring(0, 20) + "..." : "Image Problem",
                problem: problemText,
                solution: solutionHtml,
                image: imageBase64
            };
            solveHistory.unshift(newEntry);
            if (solveHistory.length > 5) solveHistory.pop();
            localStorage.setItem('falconHistory', JSON.stringify(solveHistory));
            currentHistoryIndex = 0;
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (solveHistory.length === 0) {
                list.innerHTML = '<div class="opacity-40 italic text-[11px] font-sans px-2">No recent telemetry.</div>';
                return;
            }
            solveHistory.forEach((entry, index) => {
                const div = document.createElement('div');
                const isActive = (index === currentHistoryIndex);
                div.className = `flex items-center space-x-4 cursor-pointer transition-all p-3 rounded-xl ${isActive ? 'bg-zinc-100 dark:bg-white/5 opacity-100' : 'opacity-50 hover:opacity-100 hover:bg-zinc-50 dark:hover:bg-white/5'}`;
                
                const led = isActive 
                    ? `<div class="w-1.5 h-1.5 rounded-full bg-falcon shadow-[0_0_8px_#00E5FF] flex-shrink-0"></div>`
                    : `<div class="w-1.5 h-1.5 rounded-full bg-zinc-300 dark:bg-zinc-700 flex-shrink-0"></div>`;
                    
                div.innerHTML = `${led} <span class="text-xs font-sans ${isActive ? 'font-medium' : 'font-light'} flex-grow line-clamp-1">${entry.title}</span>`;
                div.onclick = () => { currentHistoryIndex = index; renderHistory(); loadHistoryEntry(index); };
                list.appendChild(div);
            });
        }

        function loadHistoryEntry(index) {
            const entry = solveHistory[index];
            if(currentMode === 'text') document.getElementById('textInput').value = entry.problem || "";
            else document.getElementById('mathInput').value = entry.problem || "";
            
            if (entry.image) {
                const img = document.getElementById('imagePreview');
                img.src = "data:image/jpeg;base64," + entry.image;
                img.style.display = "block";
                document.getElementById('removeImgBtn').style.display = "block";
                base64ImagePayload = entry.image;
            } else clearImage();
            
            document.getElementById('outputContainer').classList.remove('hidden');
            document.getElementById('outputContainer').classList.add('flex');
            currentCleanSolution = entry.solution; 
            document.getElementById('outputArea').innerHTML = entry.solution;
            document.getElementById('exportBtnRow').style.display = "block";
            
            shrinkInput(); 
            document.getElementById('outputArea').scrollTop = 0;
            if (window.MathJax) MathJax.typesetPromise([document.getElementById('outputArea')]);
        }

        async function simulateSolve() {
            const textVal = document.getElementById('textInput').value.trim();
            const mathVal = document.getElementById('mathInput').value.trim();
            const input = (currentMode === 'text') ? textVal : mathVal;
            if(!input && !base64ImagePayload) return;
            
            const btn = document.getElementById('solveBtn');
            const outputArea = document.getElementById('outputArea');
            const outputContainer = document.getElementById('outputContainer');
            
            btn.innerHTML = 'EXECUTING...'; btn.disabled = true; btn.style.opacity = '0.5';
            outputContainer.classList.remove('hidden');
            outputContainer.classList.add('flex');
            outputArea.innerHTML = "<span class='font-mono text-[10px] text-zinc-500 tracking-widest uppercase'>Establishing handshake...</span>";
            document.getElementById('exportBtnRow').style.display = "none";
            
            shrinkInput();

            try {
                const response = await fetch('https://falcon-tawny.vercel.app/api/solve', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem: input, image: base64ImagePayload })
                });
                const data = await response.json();
                if (response.ok) {
                    const formatted = marked.parse(data.solution);
                    currentCleanSolution = formatted; 
                    outputArea.innerHTML = formatted;
                    
                    if (window.MathJax) MathJax.typesetPromise([outputArea]);
                    saveToHistory(input, formatted, base64ImagePayload);
                    document.getElementById('exportBtnRow').style.display = "block";
                    outputArea.scrollTop = 0;
                } else outputArea.innerHTML = `<span class="text-red-400 text-sm">Error: ${data.error}</span>`;
            } catch (e) { outputArea.innerHTML = "<span class='text-red-400 text-sm'>Fatal Error: Connection failed.</span>"; }
            finally { btn.innerHTML = "EXECUTE"; btn.disabled = false; btn.style.opacity = '1'; }
        }

        function exportSinglePDF() {
            const textVal = document.getElementById('textInput').value.trim();
            const mathVal = document.getElementById('mathInput').value.trim();
            
            let inputProblem = "";
            if (currentMode === 'math' && mathVal) {
                inputProblem = `$$ ${mathVal} $$`; 
            } else {
                inputProblem = textVal;
            }
            
            const overlay = document.getElementById('pdfLoadingOverlay');
            overlay.style.display = 'flex';

            const memoryDiv = document.createElement('div');
            memoryDiv.style.width = '800px';
            memoryDiv.style.padding = '40px';
            memoryDiv.style.backgroundColor = '#FAF9F6'; 
            memoryDiv.style.color = '#111110';
            memoryDiv.style.fontFamily = 'sans-serif';
            memoryDiv.style.boxSizing = 'border-box';
            
            let imgTag = '';
            if (base64ImagePayload) {
                imgTag = `<img src="data:image/jpeg;base64,${base64ImagePayload}" style="max-height: 250px; margin-top: 15px; border: 1px solid #eee; border-radius: 8px;">`;
            }

            memoryDiv.innerHTML = `
                <style>
                    p, div, span { white-space: normal !important; word-wrap: break-word !important; word-break: break-word !important; max-width: 100%; }
                    mjx-lin { border-top: 1px solid black !important; }
                    .mjx-solid { border-top: 1px solid black !important; }
                </style>

                <div style="border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <h1 style="font-size: 32px; font-weight: 500; margin: 0; font-family: 'Playfair Display', serif;">Falcon Ledger</h1>
                    <div style="font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 2px; font-family: monospace;">Generated Output</div>
                </div>
                
                <div style="margin-bottom: 30px;">
                    <h3 style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 10px;">Parameter Input</h3>
                    <div style="font-size: 16px; font-weight: 400; color: #111;">${inputProblem || "Visual Asset Analyzed"}</div>
                    ${imgTag}
                </div>
                
                <div>
                    <h3 style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 10px; padding-top: 20px; border-top: 1px solid #eee;">System Output</h3>
                    <div style="font-size: 14px; line-height: 1.7; color: #222;">${currentCleanSolution}</div>
                </div>
                
                <div style="margin-top: 50px; padding-top: 15px; border-top: 1px solid #ddd; text-align: center; font-size: 9px; color: #999; text-transform: uppercase; letter-spacing: 3px; font-family: monospace;">
                    Sumtying Protocol V4.0.2
                </div>
            `;

            const opt = {
                margin:       0.5, 
                filename:     'Falcon_Ledger_' + Date.now() + '.pdf',
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true }, 
                pagebreak:    { mode: 'css', avoid: ['mjx-container', 'p', 'h3', 'img'] },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            setTimeout(() => {
                if (window.MathJax) {
                    MathJax.typesetPromise([memoryDiv]).then(() => {
                        html2pdf().set(opt).from(memoryDiv).save().then(() => {
                            overlay.style.display = 'none'; 
                        });
                    }).catch(err => {
                        console.error("Math rendering failed:", err);
                        overlay.style.display = 'none';
                    });
                } else {
                    html2pdf().set(opt).from(memoryDiv).save().then(() => {
                        overlay.style.display = 'none';
                    });
                }
            }, 100); 
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = 'light_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'dark');
            }
            setMode(currentMode); 
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            const mf = document.getElementById('mathInput');
            if(mf) {
                mf.setOptions({ virtualKeyboardMode: "onfocus", virtualKeyboardTheme: "dark" });
                window.mathVirtualKeyboard.container = document.body;
            }
            
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                icon.innerText = 'light_mode';
            }
            setMode(currentMode);
        });
    </script>
</body>
</html>
