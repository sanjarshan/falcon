<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Falcon | Engineering Solver</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 0.9em;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        .output-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #0d1117;
            border-left: 4px solid #58a6ff;
            border-radius: 0 5px 5px 0;
            display: none; /* Hidden until solve is clicked */
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PROJECT FALCON</h1>
        <p class="subtitle">Advanced Engineering Step-by-Step Solver</p>

        <textarea id="problemInput" placeholder="Enter your Circuit Theory, Vector Analysis, or math problem here..."></textarea>
        
        <button id="solveBtn" onclick="simulateSolve()">INITIATE SOLVE</button>

        <div id="outputArea" class="output-box">
            </div>
    </div>

    <script>
        // This is a temporary function just to test the UI tonight.
        // Tomorrow we replace this with the actual Vercel API fetch.
        function simulateSolve() {
            const btn = document.getElementById('solveBtn');
            const output = document.getElementById('outputArea');
            const input = document.getElementById('problemInput').value;

            if(!input) {
                alert("Please enter a problem first.");
                return;
            }

            btn.innerText = "CALCULATING...";
            btn.style.backgroundColor = "#8b949e";
            
            // Simulating a 2 second API delay
            setTimeout(() => {
                output.style.display = "block";
                output.innerHTML = "System initialized.\n\nSimulated Output for: " + input + "\n\n[API Connection Pending Vercel Setup]";
                btn.innerText = "INITIATE SOLVE";
                btn.style.backgroundColor = "#238636";
            }, 2000);
        }
    </script>

</body>
</html>
