    <script>
        // --- TEXT ROTATOR LOGIC ---
        const words = ["anything.", "everything.", "sumtying."];
        let wordIndex = 0;
        const rotatingText = document.getElementById('rotating-text');

        setInterval(() => {
            // Fade out
            rotatingText.style.opacity = 0;
            
            setTimeout(() => {
                // Change word
                wordIndex = (wordIndex + 1) % words.length;
                const nextWord = words[wordIndex];
                rotatingText.innerText = nextWord;
                
                // If the word is "sumtying.", apply the elegant serif styling
                if (nextWord === "sumtying.") {
                    rotatingText.classList.remove("font-sans");
                    rotatingText.classList.add("font-serif", "italic");
                } else {
                    // Revert to clean sans-serif for anything/everything
                    rotatingText.classList.remove("font-serif", "italic");
                    rotatingText.classList.add("font-sans");
                }
                
                // Fade in
                rotatingText.style.opacity = 1;
            }, 500); // Wait for fade-out to finish before swapping text
        }, 2500); // Time each word stays on screen

        // --- THEME TOGGLE LOGIC ---
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = 'light_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'dark');
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                icon.innerText = 'light_mode';
            }
        });
    </script>
